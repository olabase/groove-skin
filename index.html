<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groove – Video.js Skin</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.2.0/video.js"></script>
  <style>
    body { margin: 0; background: #1a1714; color: #f3e6c8; font-family: Georgia, serif; padding: 16px; }
    h1 { text-align: center; }
    video-skin { width: 100%; max-width: 720px; margin: 0 auto; display: block; }
  </style>
</head>
<body>
  <h1>Groove</h1>
  <video-player>
    <video-skin style="aspect-ratio: 16 / 9">
      <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" playsinline></video>
    </video-skin>
  </video-player>
</body>
</html>
